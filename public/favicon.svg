<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="ocean" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#5ec8ff"/>
      <stop offset="0.6" stop-color="#1f7fe0"/>
      <stop offset="1" stop-color="#0d3f8f"/>
    </radialGradient>
    <clipPath id="globe"><circle cx="32" cy="34" r="27"/></clipPath>
  </defs>

  <!-- Globe -->
  <circle cx="32" cy="34" r="27" fill="url(#ocean)"/>
  <g clip-path="url(#globe)" fill="#3fbf5f">
    <!-- Americas -->
    <path d="M9 14c5-4 12-4 15 0 2 3-1 6-4 7-3 1-3 4-1 6 3 3 2 7-1 9-2 2-1 6 1 9 2 4 0 8-3 9-3-3-4-8-4-12 0-4-4-6-5-10-1-5-1-13 2-18z"/>
    <!-- Europe / Africa -->
    <path d="M38 13c4-2 9-1 12 2 1 2-1 4-3 4-2 1-1 3 1 4 4 2 7 6 6 11-1 5-5 8-7 12-2 4-4 7-7 7-2-3-1-7-2-10-1-4-5-5-5-9 0-3 3-5 2-8-1-3-5-3-4-7 1-3 5-5 7-6z"/>
    <!-- Australia -->
    <path d="M52 48c3-1 6 1 6 4s-3 4-6 3c-2-1-3-5 0-7z"/>
  </g>
  <!-- Subtle grid -->
  <g clip-path="url(#globe)" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1">
    <ellipse cx="32" cy="34" rx="12" ry="27"/>
    <path d="M5 34h54M8 22h48M8 46h48"/>
  </g>
  <!-- Highlight -->
  <ellipse cx="22" cy="20" rx="8" ry="4.5" fill="#ffffff" opacity="0.22" transform="rotate(-25 22 20)"/>

  <!-- 3D glasses: temples (arms) -->
  <path d="M4.5 27.5 L11 25.5 M59.5 27.5 L53 25.5" stroke="#111" stroke-width="3" stroke-linecap="round"/>
  <!-- Frame -->
  <path d="M10 22.5h44a2 2 0 0 1 2 2v9a4 4 0 0 1-4 4H39.5c-2.3 0-3.4-1.5-4.2-3.4L34.6 32a2.8 2.8 0 0 0-5.2 0l-.7 2.1c-.8 1.9-1.9 3.4-4.2 3.4H12a4 4 0 0 1-4-4v-9a2 2 0 0 1 2-2z" fill="#f5f5f5" stroke="#111" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Lenses: red left, blue right -->
  <rect x="11.5" y="25.5" width="16" height="9" rx="2.5" fill="#e53935"/>
  <rect x="36.5" y="25.5" width="16" height="9" rx="2.5" fill="#1e88ff"/>
  <!-- Lens shine -->
  <path d="M14 27.5h5M39 27.5h5" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Smile -->
  <path d="M25 46.5c4 3.5 10 3.5 14 0" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
</svg>
